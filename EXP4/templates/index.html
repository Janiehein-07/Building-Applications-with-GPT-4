<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Personalized Recommendation Chatbot</title>

    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>AI Recommendation Chatbot</h1>

      <p class="subtitle">
        Tell me about yourself and I will recommend suitable learning topics.
      </p>

      <div class="chat-box" id="chatBox">
        <div class="bot-message">
          Hello! 👋
          <br /><br />
          Tell me your interests, skill level and learning goal.
        </div>
      </div>

      <div class="input-area">
        <textarea
          id="userInput"
          placeholder="Example: I am a beginner interested in Python and AI. I want practical courses..."
        ></textarea>

        <button onclick="getRecommendation()">Get Recommendations</button>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
